[project]
name = "knotgrowth-c"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["setuptools", "wheel", "cython"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[[tool.setuptools.ext-modules]]

name = "cellular_rearrangement"
sources = [
    "src/cellular_rearrangement/cellular_rearrangement_cython.pyx",
    "src/cellular_rearrangement/cellular_rearrangement.c",
    "src/cellular_rearrangement/functions.c",
]
include-dirs = ["src/cellular_rearrangement"]
libraries = ["fftw3"]
